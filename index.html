<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Солнечная система · 3D</title>
<meta name="description" content="Интерактивная 3D-демонстрация Солнечной системы" />
<link rel="icon" href="data:,">
<style>
  :root{
    color-scheme: dark;
    --bg: #05060d;
    --panel-bg: rgba(14, 17, 32, 0.72);
    --panel-border: rgba(255,255,255,0.08);
    --text: #eef1fb;
    --muted: #9aa3c7;
    --accent: #7dd3fc;
    --accent-2: #f5b942;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0; width:100%; height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  #app{ position: fixed; inset: 0; }
  canvas{ display:block; touch-action:none; }

  .glass{
    background: var(--panel-bg);
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    border: 1px solid var(--panel-border);
    box-shadow: 0 8px 32px rgba(0,0,0,0.45);
  }

  /* ---------- Top title ---------- */
  #title{
    position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
    text-align:center; pointer-events:none; z-index: 5;
    user-select:none;
  }
  #title h1{
    margin:0; font-size: 15px; font-weight: 600; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--muted);
  }
  #title h1 span{ color: var(--text); }

  /* ---------- Loading ---------- */
  #loading{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:14px; z-index:50; background: var(--bg);
    transition: opacity .6s ease;
  }
  #loading.hide{ opacity:0; pointer-events:none; }
  .spinner{
    width:42px; height:42px; border-radius:50%;
    border: 2px solid rgba(255,255,255,0.12);
    border-top-color: var(--accent);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  #loading p{ color: var(--muted); font-size: 13px; letter-spacing: 0.04em; }

  /* ---------- Info panel ---------- */
  #info-panel{
    position: fixed; top: 0; right: 0; height: 100%;
    width: 340px; max-width: 88vw;
    padding: 26px 22px;
    z-index: 10;
    transform: translateX(100%);
    transition: transform .45s cubic-bezier(.22,1,.36,1);
    overflow-y: auto;
  }
  #info-panel.open{ transform: translateX(0); }

  #info-panel .close-btn{
    position:absolute; top:16px; right:16px;
    width:30px; height:30px; border-radius:50%;
    border:1px solid var(--panel-border); background: rgba(255,255,255,0.04);
    color: var(--muted); cursor:pointer; font-size:16px; line-height:1;
    display:flex; align-items:center; justify-content:center;
    transition: background .2s, color .2s;
  }
  #info-panel .close-btn:hover{ background: rgba(255,255,255,0.1); color: var(--text); }

  #planet-swatch{
    width:64px; height:64px; border-radius:50%; margin-bottom:16px;
    box-shadow: 0 0 40px 4px var(--swatch-glow, rgba(255,255,255,0.3));
  }

  #info-panel h2{
    margin: 0 0 4px; font-size: 26px; font-weight: 700; letter-spacing: 0.01em;
  }
  #info-panel .subtitle{
    margin: 0 0 22px; color: var(--muted); font-size: 13px; letter-spacing: 0.03em;
  }

  .stat-row{
    display:flex; justify-content:space-between; align-items:baseline;
    padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.06);
    font-size: 13.5px;
  }
  .stat-row:last-of-type{ border-bottom:none; }
  .stat-row .label{ color: var(--muted); }
  .stat-row .value{ font-weight: 600; text-align:right; }
  .stat-row .value small{ display:block; font-weight:400; color: var(--muted); font-size: 11px; margin-top:2px; }

  #info-panel .fact{
    margin-top: 20px; padding: 14px 16px; border-radius: 12px;
    background: rgba(255,255,255,0.04); border: 1px solid var(--panel-border);
    font-size: 13px; line-height: 1.55; color: #cfd4ee;
  }

  /* ---------- Controls dock ---------- */
  #dock{
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    display:flex; align-items:center; gap: 18px;
    padding: 12px 20px; border-radius: 999px;
    z-index: 10;
  }
  #play-btn{
    width:40px; height:40px; border-radius:50%; flex: none;
    border: none; cursor:pointer;
    background: linear-gradient(145deg, #8fd9ff, #5fb8e8);
    color: #052033; display:flex; align-items:center; justify-content:center;
    transition: transform .15s ease;
  }
  #play-btn:hover{ transform: scale(1.07); }
  #play-btn:active{ transform: scale(0.95); }
  #play-btn svg{ width:16px; height:16px; }

  .speed-wrap{ display:flex; align-items:center; gap:10px; }
  .speed-wrap label{ font-size: 11px; color: var(--muted); letter-spacing: 0.05em; white-space:nowrap; }
  #speed{
    width: 130px; accent-color: var(--accent);
  }
  #speed-val{ font-size:12px; color: var(--text); min-width: 54px; text-align:left; font-variant-numeric: tabular-nums; }

  .divider{ width:1px; height:26px; background: rgba(255,255,255,0.1); }

  #labels-toggle, #reset-view{
    font-size: 11px; color: var(--muted); background: rgba(255,255,255,0.05);
    border: 1px solid var(--panel-border); border-radius: 999px; padding: 7px 13px;
    cursor:pointer; letter-spacing: 0.03em; white-space:nowrap;
    transition: background .2s, color .2s;
  }
  #labels-toggle.active, #labels-toggle:hover, #reset-view:hover{ background: rgba(255,255,255,0.12); color: var(--text); }

  /* ---------- Planet labels (3D -> 2D projected) ---------- */
  .planet-label{
    position:absolute; transform: translate(-50%, -140%);
    font-size: 11px; letter-spacing: 0.04em; color: var(--text);
    text-shadow: 0 1px 6px rgba(0,0,0,0.9);
    pointer-events:none; white-space:nowrap; opacity: 0.85;
    user-select:none;
  }

  #hint{
    position:fixed; left: 18px; bottom: 44px; z-index: 10;
    font-size: 11.5px; color: var(--muted); max-width: 220px; line-height:1.5;
    opacity: 0.8;
  }
  #credit{
    position:fixed; left: 18px; bottom: 18px; z-index: 10;
    font-size: 10px; color: var(--muted); opacity: 0.55;
  }
  #credit a{ color: inherit; }

  @media (max-width: 720px){
    #info-panel{ width: 100%; max-width: 100%; }
    #dock{ gap: 10px; padding: 10px 14px; bottom: 14px; flex-wrap: wrap; justify-content:center; width: calc(100% - 24px); }
    .speed-wrap label{ display:none; }
    #hint{ display:none; }
    #title h1{ font-size: 12px; }
  }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <p>Запускаем орбиты…</p>
</div>

<div id="title">
  <h1>Солнечная <span>система</span></h1>
</div>

<div id="app"></div>
<div id="label-layer" style="position:fixed; inset:0; pointer-events:none; z-index:4;"></div>

<aside id="info-panel" class="glass">
  <button class="close-btn" id="close-info" aria-label="Закрыть">✕</button>
  <div id="planet-swatch"></div>
  <h2 id="p-name">—</h2>
  <p class="subtitle" id="p-subtitle">—</p>

  <div class="stat-row">
    <span class="label">Диаметр</span>
    <span class="value" id="p-diameter">—</span>
  </div>
  <div class="stat-row">
    <span class="label">Расстояние от Солнца</span>
    <span class="value" id="p-distance">—</span>
  </div>
  <div class="stat-row">
    <span class="label">Орбитальный период</span>
    <span class="value" id="p-period">—</span>
  </div>
  <div class="stat-row">
    <span class="label">Период вращения (сутки)</span>
    <span class="value" id="p-day">—</span>
  </div>
  <div class="stat-row">
    <span class="label">Спутники</span>
    <span class="value" id="p-moons">—</span>
  </div>

  <div class="fact" id="p-fact">—</div>
</aside>

<div id="dock" class="glass">
  <button id="play-btn" aria-label="Пауза/Воспроизведение">
    <svg id="icon-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
    <svg id="icon-play" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M8 5v14l11-7z"/></svg>
  </button>
  <div class="speed-wrap">
    <label>СКОРОСТЬ</label>
    <input type="range" id="speed" min="0" max="200" value="40" />
    <span id="speed-val">1×</span>
  </div>
  <div class="divider"></div>
  <button id="labels-toggle" class="active">Названия</button>
  <button id="reset-view">Сброс вида</button>
</div>

<div id="hint">Перетаскивайте — поворот · колесо — зум · клик по планете — подробности</div>
<div id="credit">Текстуры: NASA / <a href="https://www.solarsystemscope.com/textures/" target="_blank" rel="noopener">Solar System Scope</a> (CC BY 4.0)</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module" src="./main.js"></script>
</body>
</html>
